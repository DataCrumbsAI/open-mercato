services:
  app:
    build:
      context: .
      args:
        - CONTAINER_PORT=3000
    image: open-mercato/app:latest
    user: "0"
    command: >
      sh -c "if [ ! -f /tmp/init-marker/.seeded ]; then
        echo 'First run: full initialization...';
        yarn mercato init && mkdir -p /tmp/init-marker && touch /tmp/init-marker/.seeded;
      else
        echo 'Subsequent run: migrations only...';
        yarn db:migrate;
      fi && yarn start"
    volumes:
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/apps/mercato/storage
    working_dir: /app/apps/mercato
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - PORT=3000
      - 'DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}'
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'APP_URL=${SERVICE_URL_APP}'
      - CACHE_REDIS_URL=redis://redis:6379
      - CACHE_STRATEGY=redis
      - ENABLE_CRUD_API_CACHE=true
      - 'MEILISEARCH_HOST=http://meilisearch:7700'
      - 'MEILISEARCH_API_KEY=${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}'
      - NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED=true
      - UPGRADE_ACTIONS_ENABLED=true
      - 'SELF_SERVICE_ONBOARDING_ENABLED=${SELF_SERVICE_ONBOARDING_ENABLED:-true}'
      - 'DEMO_MODE=${DEMO_MODE:-true}'
      - 'ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}'
      - 'OM_INIT_SUPERADMIN_EMAIL=${OM_INIT_SUPERADMIN_EMAIL:-}'
      - 'OM_INIT_SUPERADMIN_PASSWORD=${OM_INIT_SUPERADMIN_PASSWORD:-password}'
      - 'TENANT_DATA_ENCRYPTION=${TENANT_DATA_ENCRYPTION:-true}'
      - 'TENANT_DATA_ENCRYPTION_DEBUG=${TENANT_DATA_ENCRYPTION_DEBUG:-false}'
      - 'TENANT_DATA_ENCRYPTION_FALLBACK_KEY=${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}'
      - 'TENANT_DATA_ENCRYPTION_KEY=${TENANT_DATA_ENCRYPTION_KEY:-}'
      - SSO_FORCE_ROLE_ON_LOGIN=employee
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:-}'
      - 'RESEND_API_KEY=${RESEND_API_KEY:-}'
      - 'EMAIL_FROM=${EMAIL_FROM:-}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/backend || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: always
  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: always
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER:-postgres}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}'
      - 'POSTGRES_DB=${POSTGRES_DB:-open-mercato}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: always
    environment:
      - MEILI_ENV=development
      - 'MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}'
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Host: mercato.datacrumbs.hr' http://localhost:3000/backend || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  init_marker:
  attachments_storage:
